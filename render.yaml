databases:
  - name: supportiq-db
    databaseName: supportiq
    plan: free

services:
  - type: web
    name: supportiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: supportiq-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
